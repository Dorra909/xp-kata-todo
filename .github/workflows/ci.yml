name: CI — XP Kata

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Vérification de la dette technique
        run: |
          echo "=== Recherche des TODO/FIXME ==="
          grep -rn "TODO\|FIXME" iteration2_xp/src || echo "Aucun TODO/FIXME détecté"

      - name: Lancement des tests avec couverture
        run: |
          cd iteration2_xp
          pytest --cov=src --cov-report=term-missing --cov-fail-under=90
